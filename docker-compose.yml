# Hạ tầng dev local (Sprint 0) — CHƯA chạy thử trên máy dựng khung (không có Docker).
#   postgres : PostgreSQL cho API/migration
#   edge     : Caddy mô phỏng CDN đa subdomain; Caddyfile SINH TỪ config/sites/sites.json
#              (node tools/sites/generate-caddyfile.mjs) — ADR-0001 D10.
# App chạy trên máy: API `dotnet run` (5080), web `npm run dev -w @tinhte/web` (3000), cms (3001).
#   worker   : (profile "worker", tùy chọn) worker thu thập Radar tin — `docker compose --profile worker up -d worker`.
#              Chạy migration trước (Tinhte.DbMigrator). Cờ aggregation.radar OFF thì worker chạy nhưng không thu thập.
# Truy cập qua edge: http://www.tinhte.localhost:8080 , http://cms.tinhte.localhost:8080 (trình duyệt tự trỏ *.localhost về 127.0.0.1).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tinhte
      POSTGRES_USER: tinhte
      POSTGRES_PASSWORD: ${TT_LOCAL_PG_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinhte -d tinhte"]
      interval: 5s
      retries: 10

  edge:
    image: caddy:2
    ports:
      - "8080:8080"
    volumes:
      - ./infra/local/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: backend/src/Tinhte.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      Sites__Environment: local
      ConnectionStrings__Tinhte: Host=postgres;Port=5432;Username=tinhte;Password=${TT_LOCAL_PG_PASSWORD:-change-me-local-only};Database=tinhte
      Aggregation__Worker__PollSeconds: "30"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: {}
