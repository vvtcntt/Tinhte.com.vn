name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sites:
    name: Site registry (ADR-0001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/sites/validate.mjs
      - run: node tools/check-hardcoded-hosts.mjs
      - run: node tools/sites/generate-caddyfile.mjs --check
      - run: node --test "frontend/packages/sites/test/*.test.ts"

  backend:
    name: Backend (.NET 10 + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      # PostgreSQL thật cho test DB (WBS-013): migration runner, trigger → Problem, idempotency.
      # Mật khẩu chỉ dùng trong container CI tạm thời, không phải bí mật.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tinhte_test
          POSTGRES_USER: tinhte
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tinhte -d tinhte_test"
          --health-interval 5s
          --health-retries 10
    env:
      TT_TEST_PG: Host=127.0.0.1;Port=5432;Username=tinhte;Password=ci-only;Database=tinhte_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4   # MigrationTests so khớp SQL đồng bộ tt.sites với tools/sites/generate-db-sync.mjs
        with:
          node-version: 24
      - run: dotnet build backend/Tinhte.slnx -nologo
      - run: dotnet test backend/Tinhte.slnx --no-build -nologo
      - name: DbMigrator smoke (up twice + status)
        env:
          DOTNET_ENVIRONMENT: Development
          ConnectionStrings__Tinhte: ${{ env.TT_TEST_PG }}
        run: |
          dotnet backend/src/Tinhte.DbMigrator/bin/Debug/net10.0/Tinhte.DbMigrator.dll up
          dotnet backend/src/Tinhte.DbMigrator/bin/Debug/net10.0/Tinhte.DbMigrator.dll up
          dotnet backend/src/Tinhte.DbMigrator/bin/Debug/net10.0/Tinhte.DbMigrator.dll status

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck

  contract:
    name: Contract v0.3 (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3 openapi-spec-validator jsonschema
      - name: test_static_contract.py on v0.3 (spec + inventory + trace)
        working-directory: doc/07_AI_REVIEW/contract-tests
        env:
          TT_SPEC_FILE: ../v0.3/07_OPENAPI_TINHTE_v0.3_DRAFT.yaml
          TT_INVENTORY_FILE: ../v0.3/07_API_ENDPOINT_INVENTORY_v0.3_DRAFT.csv
          TT_FR84_FILE: ../v0.3/trace/07_FR84_TRACEABILITY_v0.3_DRAFT.csv
          TT_WBS_FILE: ../v0.3/trace/07_WBS_EXTENDED_v0.3_DRAFT.csv
        run: python -m unittest -v test_static_contract.py

  db-migrations:
    name: DB migrations v0.3 (PGlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc/07_AI_REVIEW/v0.3/db/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  worker-image:
    name: Worker image (build + scan)
    # Image worker Radar tin (ADR-0008 §4): build từ gốc repo, khởi động được, không có lỗ hổng CRITICAL/HIGH đã có bản vá; kiểm cú pháp luật cảnh báo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/src/Tinhte.Worker/Dockerfile
          tags: tinhte-worker:ci
          load: true
          push: false
      - name: Smoke — thiếu chuỗi kết nối thì thoát mã 1 với thông báo rõ
        run: |
          set +e
          out=$(docker run --rm tinhte-worker:ci 2>&1); code=$?
          echo "$out"
          test "$code" -eq 1 && echo "$out" | grep -q "ConnectionStrings:Tinhte is not configured"
      - name: Scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: tinhte-worker:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Check alert rules (promtool)
        run: docker run --rm -v "$PWD/infra/monitoring:/rules:ro" --entrypoint promtool prom/prometheus:v2.55.1 check rules /rules/aggregation-worker.rules.yml
