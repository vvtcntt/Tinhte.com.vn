openapi: 3.1.0
info:
  title: Tinhte.com.vn Reference API Contract
  version: 0.3.0-draft
  description: Contract draft v0.3 applying AI review proposals (doc/07_AI_REVIEW/07_AI_TECH_REVIEW_PROPOSALS.md) on top of v0.2. DRAFT pending
    Tech Lead, PO and Legal review; not implementation-tested. Does not supersede v0.2 until signed off. P0* community and P0-ADS remain behind
    public release gates; no flag is enabled by this document.
  x-status: DRAFT_PENDING_TL_PO_LEGAL_REVIEW
  x-based-on: 0.2.0-draft
  x-changelog: doc/07_AI_REVIEW/v0.3/07_OPENAPI_v0.3_CHANGELOG.md
servers:
- url: https://{siteHost}/api/v1
  description: 'Same-origin API per site (ADR-0001 D3): the edge routes /api/* of every site with apiSurfaces to the API service, which resolves
    the site from Host. Public operations are served on sites with apiSurfaces ''public''; /admin/* and /auth/staff/* only on sites with apiSurfaces
    ''admin''. Hosts are generated from config/sites/sites.json.'
  variables:
    siteHost:
      default: www.tinhte.com.vn
      enum:
      - www.tinhte.com.vn
      - cms.tinhte.com.vn
      - www.staging.tinhte.com.vn
      - cms.staging.tinhte.com.vn
tags:
- name: PublicNews
- name: PublicVideo
- name: Discovery
- name: CmsNews
- name: Media
- name: CommunityGated
- name: ModerationGated
- name: Account
- name: CmsVideo
- name: CmsTaxonomy
- name: CmsUsers
- name: CmsRights
- name: Analytics
- name: Advertising
- name: AiOptional
- name: MemberOptional
- name: PublicHome
- name: CmsHome
- name: StaffAuth
- name: CmsAggregation
x-feature-flags:
  description: Single source of truth for feature flag keys (AIR-001). x-feature-gate and x-conditional-gate values MUST be keys of this registry.
    legacyKeys lists names used in v0.2 documents/DB that must be migrated to the registry key. Turning a flag ON in production requires approval_reference,
    approved_by, approved_at and an audit record; runtime env vars are not an accepted source.
  flags:
  - key: community.video_comments
    scope: P0*
    productionDefault: false
    approvers:
    - Legal
    - PO
    legacyKeys:
    - video_comments_enabled
    - community.comments.enabled
    - community.comments
    publicConfigField: videoCommentsEnabled
    description: Public read/write of video comments, replies, likes and reports.
  - key: community.article_comments
    scope: P0*
    productionDefault: false
    approvers:
    - Legal
    - PO
    legacyKeys:
    - article_comments_enabled
    description: Reserved. No endpoints in v0.3; PO decides P0* vs P1 (AIR-020).
  - key: community.member
    scope: P0*
    productionDefault: false
    approvers:
    - Legal
    - PO
    legacyKeys:
    - community.member
    publicConfigField: memberLoginEnabled
    description: Member OIDC login, eligibility, verification and /me endpoints.
  - key: community.moderation
    scope: P0*
    productionDefault: true
    approvers:
    - Security
    legacyKeys: []
    description: Staff moderation tooling. Stays ON while public community flags are OFF so existing content can be cleaned up (AIR-007). Only
      Security may turn it off.
  - key: community.ugc
    scope: P1
    productionDefault: false
    approvers:
    - Legal
    - PO
    legacyKeys:
    - community.ugc.enabled
    - user_upload_enabled
    - public_creator_publish_enabled
    description: 'Reserved: user uploads and creator publishing. No endpoints.'
  - key: community.appeals
    scope: P1
    productionDefault: false
    approvers:
    - Legal
    - PO
    legacyKeys:
    - community.appeals
    description: Member appeals against moderation decisions.
  - key: member.bookmarks
    scope: P1
    productionDefault: false
    approvers:
    - PO
    legacyKeys:
    - member.bookmark
    description: Saved videos for members.
  - key: ads.sponsored_publication
    scope: P0-ADS
    productionDefault: false
    approvers:
    - Legal
    - PO
    - Commercial
    legacyKeys:
    - sponsored_content_publication
    - ads.sponsored_publication.enabled
    publicConfigField: sponsoredContentEnabled
    description: Allows publishing revisions with contentKind=SPONSORED. Checked inside the publish transaction and again by scheduled publish
      jobs (AIR-002).
  - key: ads.display_slots
    scope: P0-ADS
    productionDefault: false
    approvers:
    - Legal
    - PO
    - Commercial
    legacyKeys:
    - display_ad_slots
    - ads.display_slots
    publicConfigField: adSlotsEnabled
    description: Public static ad slots. When OFF, GET /ads/placements returns 200 with empty items (no layout gap).
  - key: ads.shorts_instream
    scope: P1
    productionDefault: false
    approvers:
    - Legal
    - PO
    - Commercial
    legacyKeys:
    - shorts_instream_ads
    publicConfigField: shortsInstreamAdsEnabled
    description: In-stream ads inside Shorts. OFF in MVP.
  - key: ads.campaign_advanced
    scope: P1
    productionDefault: false
    approvers:
    - PO
    - Commercial
    legacyKeys:
    - ads.campaign_advanced
    description: Campaign management and ad reports.
  - key: discovery.series
    scope: P1
    productionDefault: false
    approvers:
    - PO
    legacyKeys: []
    description: Series pages (FR-NEWS-009).
  - key: discovery.search_suggestions
    scope: P1
    productionDefault: false
    approvers:
    - PO
    legacyKeys: []
    description: Search suggestions (FR-DISC-006).
  - key: cms.related_suggestions
    scope: P1
    productionDefault: false
    approvers:
    - PO
    legacyKeys: []
    description: Related content suggestions in CMS (FR-CMS-008).
  - key: analytics.operations
    scope: P1
    productionDefault: false
    approvers:
    - PO
    legacyKeys: []
    description: Editorial/moderation operations metrics (FR-ANL-006).
  - key: ai.assistance
    scope: P2
    productionDefault: false
    approvers:
    - PO
    - Legal
    legacyKeys:
    - ai.assistance
    description: AI metadata/transcript assistance.
  - key: ai.search
    scope: P2
    productionDefault: false
    approvers:
    - PO
    - Legal
    legacyKeys:
    - ai.search
    description: AI search with sources.
  - key: aggregation.radar
    scope: P2
    productionDefault: false
    approvers:
    - PO
    legacyKeys: []
    description: 'News radar (ADR-0008, BA-01 phase 1): source profiles, feed collection, clustering and CMS radar. No AI. Scope recorded as P2
      until PO ranks it (BA-01 Q-AGG-06). The collector worker also stops while OFF.'
  - key: discovery.most_read
    scope: P1
    productionDefault: false
    approvers:
    - PO
    - Legal
    legacyKeys: []
    description: '"Đọc nhiều" block (UX-PUB-01 đợt 3, PROPOSED). Ranking derived from aggregated read events (FR-ANL-001); the data source
      and the definition of a counted read are not decided (TL/PO/Legal). While OFF, GET /discovery/most-read returns 200 with empty items.'
x-error-catalog:
  description: 'Error codes returned in Problem.code (AIR-009). Each code maps to exactly one HTTP status. Evaluation order: 400 syntax → 401
    → 403 CSRF_INVALID → 403 FEATURE_DISABLED → 403 FORBIDDEN/ELIGIBILITY_REQUIRED/SOD_VIOLATION → 404 → 428/412 → 422 → 409 → 429 (a gateway
    may return 429 earlier).'
  codes:
  - code: BAD_REQUEST
    status: 400
    description: Malformed request, unknown or invalid parameter.
  - code: INVALID_CURSOR
    status: 400
    description: Cursor is not a valid signed cursor for this list.
  - code: OIDC_STATE_INVALID
    status: 400
    description: OIDC state/nonce/PKCE verification failed.
  - code: UNAUTHENTICATED
    status: 401
    description: No valid session.
  - code: CSRF_INVALID
    status: 403
    description: Missing or invalid X-CSRF-Token on a cookie-authenticated mutation.
  - code: FEATURE_DISABLED
    status: 403
    description: Required feature flag is OFF (checked server-side; flag flips are re-checked inside write transactions).
  - code: FORBIDDEN
    status: 403
    description: Authenticated but the role/permission does not allow the action.
  - code: ELIGIBILITY_REQUIRED
    status: 403
    description: Member does not satisfy the approved eligibility/verification policy.
  - code: SOD_VIOLATION
    status: 403
    description: 'Separation of duties: actor cannot approve/publish their own revision.'
  - code: RIGHTS_EXPIRED
    status: 403
    description: Media rights expired or revoked; no playback grant is issued.
  - code: NOT_FOUND
    status: 404
    description: Resource does not exist or is not visible to the caller.
  - code: STATE_CONFLICT
    status: 409
    description: Transition not allowed from the current state.
  - code: IDEMPOTENCY_KEY_REUSED
    status: 409
    description: Same Idempotency-Key used with a different payload.
  - code: CONTENT_LOCKED
    status: 409
    description: Target content is locked, removed or no longer accepts interactions.
  - code: CONTENT_WITHDRAWN
    status: 410
    description: Content was withdrawn/taken down.
  - code: REVISION_CONFLICT
    status: 412
    description: If-Match does not match the current ETag.
  - code: PAYLOAD_TOO_LARGE
    status: 413
    description: Request or upload exceeds the allowed size.
  - code: VALIDATION_FAILED
    status: 422
    description: Domain validation failed; see errors map.
  - code: REASON_REQUIRED
    status: 422
    description: A reason is mandatory for this action.
  - code: SPONSORSHIP_LABEL_REQUIRED
    status: 422
    description: contentKind=SPONSORED without complete sponsorship metadata.
  - code: SPONSORSHIP_EXPIRED
    status: 422
    description: Sponsorship validity window has ended or not started.
  - code: RIGHTS_INVALID
    status: 422
    description: Source/licence/rights metadata missing or expired at publish time.
  - code: MEDIA_NOT_READY
    status: 422
    description: Media is not READY (still processing, failed, quarantined).
  - code: UNSAFE_URL
    status: 422
    description: URL is not https or is on a blocked list.
  - code: PRECONDITION_REQUIRED
    status: 428
    description: If-Match header is required for this operation.
  - code: RATE_LIMITED
    status: 429
    description: Rate limit exceeded; see Retry-After.
  - code: DEPENDENCY_UNAVAILABLE
    status: 503
    description: A downstream dependency (media/CDN/IdP) is unavailable.
paths:
  /articles:
    get:
      tags:
      - PublicNews
      summary: Public article feed
      description: 'Access: Public, no session.'
      operationId: listPublicArticles
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: category
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Published articles only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleList'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-requirements:
      - FR-DISC-004
      - FR-ID-001
      x-scope: P0
      x-error-codes:
      - BAD_REQUEST
      - INVALID_CURSOR
  /articles/{slug}:
    get:
      tags:
      - PublicNews
      summary: Public article (only published revision and valid rights)
      description: 'Access: Public, no session.'
      operationId: getPublicArticle
      parameters:
      - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Public article
          headers:
            ETag:
              schema:
                type: string
              description: Published revision/version tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '308':
          $ref: '#/components/responses/PermanentRedirect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
      x-requirements:
      - FR-DISC-007
      - FR-NEWS-001
      - FR-NEWS-002
      - FR-NEWS-008
      - FR-NEWS-010
      x-scope: P0
      x-error-codes:
      - BAD_REQUEST
      - NOT_FOUND
      - CONTENT_WITHDRAWN
  /videos:
    get:
      tags:
      - PublicVideo
      summary: Public Shorts feed ordered by approved policy
      description: 'Access: Public, no session.'
      operationId: listPublicVideos
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Published & rights-cleared video metadata only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoList'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-requirements:
      - FR-DISC-004
      - FR-ID-001
      - FR-VID-001
      - FR-VID-012
      - FR-VID-014
      x-scope: P0
      x-error-codes:
      - BAD_REQUEST
      - INVALID_CURSOR
  /videos/{videoId}:
    get:
      tags:
      - PublicVideo
      summary: Public video watch metadata
      description: 'Access: Public, no session.'
      operationId: getPublicVideo
      parameters:
      - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Video object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
      x-requirements:
      - FR-VID-003
      - FR-VID-004
      x-scope: P0
      x-error-codes:
      - BAD_REQUEST
      - NOT_FOUND
      - CONTENT_WITHDRAWN
  /videos/{videoId}/playback:
    get:
      tags:
      - PublicVideo
      summary: Server-side rights gate and short-lived playback manifest authorization
      description: 'Rights re-checked on every call. Expired/revoked rights → 403 RIGHTS_EXPIRED; taken down → 410. Every grant carries expiresAt.
        Access: Public, no session.'
      operationId: getVideoPlayback
      parameters:
      - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Signed derived manifest information, not raw source object keys
          headers:
            Cache-Control:
              schema:
                type: string
              description: Private/no-store or short TTL per rights policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-requirements:
      - FR-VID-002
      - FR-VID-011
      x-scope: P0
      x-error-codes:
      - BAD_REQUEST
      - NOT_FOUND
      - CONTENT_WITHDRAWN
      - DEPENDENCY_UNAVAILABLE
      - RIGHTS_EXPIRED
  /search:
    get:
      tags:
      - Discovery
      summary: Public search for published news/video
      description: 'Access: Public, no session.'
      operationId: searchPublicContent
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search result list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - FR-DISC-001
      - FR-DISC-004
      x-scope: P0
      x-error-codes:
      - BAD_REQUEST
      - INVALID_CURSOR
      - RATE_LIMITED
  /admin/articles:
    get:
      tags:
      - CmsNews
      summary: Paginated CMS article list
      description: 'Access: Staff session (cmsSession) with RBAC enforced in the domain layer.'
      operationId: getAdminArticles
      security:
      - cmsSession: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/ContentStatusFilter'
      - $ref: '#/components/parameters/OwnerId'
      - $ref: '#/components/parameters/AssigneeId'
      - $ref: '#/components/parameters/UpdatedFrom'
      - $ref: '#/components/parameters/UpdatedTo'
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/AdminSort'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-requirements:
      - FR-CMS-006
      x-scope: P0
      x-error-codes:
      - BAD_REQUEST
      - INVALID_CURSOR
      - UNAUTHENTICATED
      - FORBIDDEN
    post:
      tags:
      - CmsNews
      summary: Create article draft (CMS only)
      description: 'Access: Staff session (cmsSession) with RBAC enforced in the domain layer. Retry-safe with Idempotency-Key.'
      operationId: createArticleDraft
      security:
      - cmsSession: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArticleRequest'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - FR-CMS-001
      x-scope: P0
      x-error-codes:
      - BAD_REQUEST
      - UNAUTHENTICATED
      - CSRF_INVALID
      - FORBIDDEN
      - STATE_CONFLICT
      - IDEMPOTENCY_KEY_REUSED
      - VALIDATION_FAILED
      - RATE_LIMITED
      - SPONSORSHIP_LABEL_REQUIRED
  /admin/articles/{articleId}/submit:
    post:
      tags:
      - CmsNews
      summary: Submit draft revision for review
      description: 'Access: Staff session (cmsSession) with RBAC enforced in the domain layer. Optimistic concurrency: send If-Match with the
        latest ETag. Retry-safe with Idempotency-Key.'
      operationId: submitArticleForReview
      security:
      - cmsSession: []
      parameters:
      - $ref: '#/components/parameters/ArticleId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '200':
          description: In review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - FR-NEWS-004
      x-scope: P0
      x-error-codes:
      - BAD_REQUEST
      - UNAUTHENTICATED
      - CSRF_INVALID
      - FORBIDDEN
      - NOT_FOUND
      - STATE_CONFLICT
      - IDEMPOTENCY_KEY_REUSED
      - REVISION_CONFLICT
      - PRECONDITION_REQUIRED
      - RATE_LIMITED
  /admin/articles/{articleId}/approve:
    post:
      tags:
      - CmsNews
      summary: Approve revision with separation-of-duties policy
      description: 'Access: Staff session (cmsSession) with RBAC enforced in the domain layer. Optimistic concurrency: send If-Match with the
        latest ETag. Retry-safe with Idempotency-Key.'
      operationId: approveArticleRevision
      security:
      - cmsSession: []
      parameters:
      - $ref: '#/components/parameters/ArticleId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: Revision approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - FR-CMS-002
      - FR-NEWS-004
      x-scope: P0
      x-error-codes:
      - BAD_REQUEST
      - UNAUTHENTICATED
      - CSRF_INVALID
      - FORBIDDEN
      - NOT_FOUND
      - STATE_CONFLICT
      - IDEMPOTENCY_KEY_REUSED
      - REVISION_CONFLICT
      - PRECONDITION_REQUIRED
      - VALIDATION_FAILED
      - RATE_LIMITED
      - SOD_VIOLATION
  /admin/articles/{articleId}/publish:
    post:
      tags:
      - CmsNews
      summary: Publish approved article revision, rights validated in DB transaction
      description: 'Publishes the given APPROVED revision. In one DB transaction: re-check role/SoD, rights/source metadata, and for SPONSORED
        revisions the ads.sponsored_publication flag plus complete sponsorship within its validity window; then switch publicRevisionId and emit
        ContentPublished via outbox. Access: Staff session (cmsSession) with RBAC enforced in the domain layer. Optimistic concurrency: send If-Match
        with the latest ETag. Retry-safe with Idempotency-Key.'
      operationId: publishArticle
      security:
      - cmsSession: []
      parameters:
      - $ref: '#/components/parameters/ArticleId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - FR-CMS-003
      x-scope: P0
      x-conditional-gate:
        flag: ads.sponsored_publication
        when: revision.contentKind == SPONSORED
        onDisabled: 403 FEATURE_DISABLED
        checkedIn: publish transaction before switching publicRevisionId; scheduled jobs re-check at execution time
      x-error-codes:
      - BAD_REQUEST
      - UNAUTHENTICATED
      - CSRF_INVALID
      - FORBIDDEN
      - NOT_FOUND
      - STATE_CONFLICT
      - IDEMPOTENCY_KEY_REUSED
      - REVISION_CONFLICT
      - PRECONDITION_REQUIRED
      - VALIDATION_FAILED
      - RATE_LIMITED
      - SOD_VIOLATION
      - RIGHTS_INVALID
