      summary: Eligible public ad placements without user targeting
      description: 'No user targeting. Placements belong to a site (ADR-0001): only placements of the site resolved from Host are considered,
        so the same code on two sites never leaks across. A slot is returned only when its placement is ACTIVE and at least one breakpoint
        has a creative to serve; per breakpoint the server picks one creative from ACTIVE bookings inside their schedule window (highest
        priority, then latest startsAt, then booking id) whose media is READY, IMAGE, PUBLIC and rights CLEARED. No creative → no slot (the
        page renders no empty frame). Unknown or inactive codes are omitted, not errors. Access: Public, no session. Feature gate `ads.display_slots`
        (production default OFF), enforced server-side. DRAFT v0.3 (đợt 3 trang chủ): multi-size slots replace the single width/height.'
