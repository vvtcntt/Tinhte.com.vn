        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        summary:
          type:
          - string
          - 'null'
        publishedAt:
          type: string
          format: date-time
        thumbnailUrl:
          type:
          - string
          - 'null'
          format: uri
        contentKind:
          $ref: '#/components/schemas/ContentKind'
        sponsorLabel:
          type:
          - string
          - 'null'
          description: Display label, e.g. 'Nội dung tài trợ' (text approved by Legal)
        category:
          oneOf:
          - $ref: '#/components/schemas/CategoryRef'
          - type: 'null'
          description: 'DRAFT v0.3 (đợt 3 trang chủ): category of the article as last published (tt.articles.category_id), only when it is
            enabled and belongs to the same site; otherwise null. Optional: clients must render the card without it.'
      allOf:
      - $ref: '#/components/schemas/SponsoredLabelRule'
    MostReadArticleList:
      type: object
      description: 'PROPOSED (UX-PUB-01 đợt 3). Ranked public article cards for the "Đọc nhiều" block. No counts are exposed (avoid leaking
        traffic numbers and gaming); ordering carries the rank.'
      required:
      - window
      - items
      properties:
        window:
          type: string
          enum:
          - 24h
          - 7d
        generatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the ranking was computed (aggregation lag is expected); null when items is empty.
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ArticleSummary'
          description: Rank order, 1 = most read. Articles withdrawn after the ranking was computed are dropped, not replaced.
    CategoryRef:
