          $ref: '#/components/responses/ValidationError'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - FR-AGG-004
      - FR-AGG-005
      x-scope: P2
      x-feature-gate: aggregation.radar
      x-error-codes:
      - BAD_REQUEST
      - UNAUTHENTICATED
      - CSRF_INVALID
      - FEATURE_DISABLED
      - FORBIDDEN
      - NOT_FOUND
      - STATE_CONFLICT
      - REVISION_CONFLICT
      - PRECONDITION_REQUIRED
      - VALIDATION_FAILED
      - RATE_LIMITED
  /admin/aggregation/stats:
    get:
      tags:
      - CmsAggregation
      summary: Collection health and radar counters for a day
      description: 'Access: Staff session (cmsSession) with permission aggregation.read. Feature gate `aggregation.radar` (production default OFF),
        enforced server-side.'
      operationId: getAdminAggregationStats
      security:
      - cmsSession: []
      parameters:
      - $ref: '#/components/parameters/AggregationSiteKeyQuery'
      - $ref: '#/components/parameters/AggregationDate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregationStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-requirements:
      - FR-AGG-002
      - FR-AGG-005
      x-scope: P2
      x-feature-gate: aggregation.radar
      x-error-codes:
      - BAD_REQUEST
      - UNAUTHENTICATED
      - FEATURE_DISABLED
      - FORBIDDEN
components:
  securitySchemes:
    cmsSession:
      type: apiKey
      in: cookie
      name: __Host-tt_cms_session
      description: Host-only cookie (__Host- prefix, Secure, HttpOnly, SameSite=Lax) on the cms site only (ADR-0001 D4/D5). Mutations require
        Origin = site origin and X-CSRF-Token.
    memberSession:
      type: apiKey
      in: cookie
      name: __Host-tt_member_session
      description: Host-only cookie per public site (ADR-0001 D4); never Domain=parent. SSO across public sites via OIDC prompt=none. Identity
        verification and eligibility remain legal policy decisions.
  headers:
    ETag:
      description: Weak ETag W/"<rowVersion>". Send it back in If-Match.
      schema:
        type: string
    RetryAfter:
      description: Seconds until the client may retry.
      schema:
        type: integer
        minimum: 1
    IdempotentReplayed:
      description: true when the response replays an earlier request with the same Idempotency-Key.
      schema:
        type: boolean
    Location:
      description: Redirect target.
      schema:
        type: string
        format: uri-reference
    SetCookie:
      description: Session or short-lived OIDC state cookie (__Host- prefix, Secure, HttpOnly, SameSite=Lax).
      schema:
        type: string
    XRobotsTag:
      description: Preview must never be indexed.
      schema:
        type: string
        const: noindex, nofollow
    CacheControl:
      description: Caching policy for this response.
      schema:
        type: string
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
      description: Opaque HMAC-signed cursor; ordering is stable (sort key + id). Tampered cursor → 400 INVALID_CURSOR.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Example bounds; final limit TBD performance/PO
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 250
    VideoId:
      name: videoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArticleId:
      name: articleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Weak ETag W/"<rowVersion>" from the latest GET or 200 of the resource; for sub-resources (subtitles, related-articles) use
        the parent aggregate ETag. Missing → 428 PRECONDITION_REQUIRED; mismatch → 412 REVISION_CONFLICT.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
      description: 'Required for non-idempotent POST. Scope actor+method+route, retained 24h. A replay returns the original status/body with Idempotent-Replayed:
        true; the same key with a different payload returns 409 IDEMPOTENCY_KEY_REUSED.'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteKey:
      name: siteKey
      in: path
      required: true
      description: Stable site key from the Site Registry (config/sites/sites.json), e.g. www. Must be a public-web site.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{0,30}$
    PlacementId:
      name: placementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteKeyFilter:
      name: siteKey
      in: query
      required: false
      description: Only items of this Site Registry key (config/sites/sites.json, public-web). Omitted → every site. Unknown key → BAD_REQUEST.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{0,30}$
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TopicId:
      name: topicId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    XCsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 8
      description: Double-submit or equivalent CSRF protection for session cookie mutations; final scheme depends on auth ADR
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: Optional for emergency takedown; enforced (412) when present.
    ContentStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ContentStatus'
      description: Filter by one or more statuses
      style: form
      explode: false
    OwnerId:
      name: ownerId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    AssigneeId:
      name: assigneeId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    UpdatedFrom:
      name: updatedFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time
    UpdatedTo:
      name: updatedTo
      in: query
      required: false
      schema:
        type: string
        format: date-time
    Q:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
      description: Free-text filter
    AdminSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
        - updatedAt_desc
        - updatedAt_asc
        - createdAt_desc
        - title_asc
        default: updatedAt_desc
    ContentTypeFilter:
      name: contentType
      in: query
      required: false
      schema:
        type: string
        enum:
        - ARTICLE
        - VIDEO
    AnalyticsFrom:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
    AnalyticsTo:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date
    Timezone:
      name: timezone
      in: query
      required: false
      schema:
        type: string
        default: Asia/Ho_Chi_Minh
    AnalyticsSource:
      name: source
      in: query
      required: false
      schema:
        type: string
        maxLength: 80
      description: Traffic source filter
    MediaTypeFilter:
      name: mediaType
      in: query
      required: false
      schema:
        type: string
        enum:
        - VIDEO
        - IMAGE
        - SUBTITLE
        - OTHER
    RightsStatusFilter:
      name: rightsStatus
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/RightsStatus'
    VisibilityFilter:
      name: visibility
      in: query
      required: false
      schema:
        type: string
        enum:
        - PRIVATE
        - PUBLIC
    UserStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
        - ACTIVE
        - SUSPENDED
    RoleFilter:
      name: role
      in: query
      required: false
      schema:
        type: string
        maxLength: 80
    ModerationStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ModerationCaseStatus'
    PriorityFilter:
      name: priority
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ModerationPriority'
    TakedownStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TakedownStatus'
    ActorId:
      name: actorId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    AuditAction:
      name: action
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
    ObjectId:
      name: objectId
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
    AuditFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    CommentSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
        - newest
        - top
        default: newest
      description: top only when enabled by policy; pinned comments first
    PlacementCodes:
      name: placementCodes
      in: query
      required: true
      schema:
        type: array
        items:
          type: string
          pattern: ^[a-z0-9_-]{2,80}$
        minItems: 1
        maxItems: 10
      style: form
      explode: false
    CompareTo:
      name: compareTo
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Revision id to diff against
    OidcCode:
      name: code
      in: query
      required: true
      schema:
        type: string
        maxLength: 2048
    OidcState:
      name: state
      in: query
      required: true
      schema:
        type: string
        maxLength: 512
    OidcError:
      name: error
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    ReturnTo:
      name: returnTo
      in: query
      required: false
      schema:
        type: string
        pattern: ^/(?!/)[^\s]*$
        maxLength: 500
      description: Relative path on the allow-list; absolute URLs are rejected
    PreviewToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 512
    TakedownId:
      name: takedownId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeedId:
      name: feedId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClusterId:
      name: clusterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceIdQuery:
      name: sourceId
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Only items of this source.
    CategoryIdQuery:
      name: categoryId
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Only this category.
    AggregationSiteKeyQuery:
      name: siteKey
      in: query
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{0,30}$
      description: Public-web site key from the Site Registry (404 otherwise).
    AggregationDate:
      name: date
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Newsroom-local calendar date; default today in the newsroom time zone.
    AggregationWindow:
      name: window
      in: query
      required: false
      schema:
        type: string
        enum:
        - DAY
        - LAST_24H
        default: DAY
      description: DAY = the calendar day of date; LAST_24H = the 24 hours before now (date ignored).
    AggregationSourceStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/AggregationSourceStatus'
      description: Repeatable status filter.
    AggregationClusterStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/AggregationClusterStatus'
      description: Repeatable status filter; default open and watching.
    AggregationItemStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
          - NEW
          - CLASSIFIED
          - CLUSTERED
          - DUPLICATE
          - OUT_OF_SCOPE
      description: Repeatable status filter.
    AggregationMinScore:
      name: minScore
      in: query
      required: false
      schema:
        type: number
        minimum: 0
        maximum: 100
      description: Lowest cluster score to return.
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
          - BAD_REQUEST
          - INVALID_CURSOR
          - OIDC_STATE_INVALID
          - UNAUTHENTICATED
          - CSRF_INVALID
          - FEATURE_DISABLED
          - FORBIDDEN
          - ELIGIBILITY_REQUIRED
          - SOD_VIOLATION
          - RIGHTS_EXPIRED
          - NOT_FOUND
          - STATE_CONFLICT
          - IDEMPOTENCY_KEY_REUSED
          - CONTENT_LOCKED
          - CONTENT_WITHDRAWN
          - REVISION_CONFLICT
          - PAYLOAD_TOO_LARGE
          - VALIDATION_FAILED
          - REASON_REQUIRED
          - SPONSORSHIP_LABEL_REQUIRED
          - SPONSORSHIP_EXPIRED
          - RIGHTS_INVALID
          - MEDIA_NOT_READY
          - UNSAFE_URL
          - PRECONDITION_REQUIRED
          - RATE_LIMITED
          - DEPENDENCY_UNAVAILABLE
          description: See x-error-catalog
        detail:
          type: string
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    ArticleSummary:
