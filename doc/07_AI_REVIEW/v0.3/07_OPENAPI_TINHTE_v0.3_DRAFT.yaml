      required:
      - requestId
      - status
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING_VERIFICATION
    AggregationUsageMode:
      type: string
      enum:
      - M0
      - M1
      - M2
      - M3
      description: How Tinhte may use the content of a source (BA-01 §5). M0 detection only (internal radar); M1 link and short self-written mention;
        M2 facts for new articles (needs licence); M3 licensed derivative use within the licence scope.
    AggregationSourceStatus:
      type: string
      enum:
      - PROPOSED
      - ENABLED
      - PAUSED
      - DEGRADED
      - RETIRED
    AggregationFeedFormat:
      type: string
      enum:
      - AUTO
      - RSS2
      - RSS1
      - ATOM
      - JSONFEED
    AggregationFeedHealth:
      type: string
      enum:
      - NEVER_FETCHED
      - OK
      - DEGRADED
      - FAILING
      - BLOCKED_BY_ROBOTS
      - DISABLED
    AggregationFeedFailure:
      type: string
      enum:
      - TIMEOUT
      - DNS
      - TLS
      - HTTP_STATUS
      - TOO_LARGE
      - UNSUPPORTED_CONTENT_TYPE
      - PARSE_ERROR
      - ROBOTS_DISALLOWED
      - TOO_MANY_REDIRECTS
      - RATE_LIMITED_BY_SOURCE
      description: Collector outcome stored as data (feed health, feed test). Not a Problem.code.
    AggregationCategoryMapping:
      type: object
      required:
      - feedCategory
      - categoryId
      properties:
        feedCategory:
          type: string
          minLength: 1
          maxLength: 200
        categoryId:
          type: string
          format: uuid
    AggregationFeed:
      type: object
      required:
      - id
      - sourceId
      - url
      - format
      - isEnabled
      - scheduleMinutes
      - health
      - consecutiveFailures
      - rowVersion
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        url:
          type: string
          pattern: ^https://
          maxLength: 2048
        format:
          $ref: '#/components/schemas/AggregationFeedFormat'
        isEnabled:
          type: boolean
        scheduleMinutes:
          type: integer
          minimum: 5
          maximum: 1440
        categoryMapping:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AggregationCategoryMapping'
        health:
          $ref: '#/components/schemas/AggregationFeedHealth'
        lastFetchedAt:
          type:
          - string
          - 'null'
          format: date-time
        lastSuccessAt:
          type:
          - string
          - 'null'
          format: date-time
        nextFetchAt:
          type:
          - string
          - 'null'
          format: date-time
        consecutiveFailures:
          type: integer
          minimum: 0
        lastFailure:
          anyOf:
          - $ref: '#/components/schemas/AggregationFeedFailure'
          - type: 'null'
        rowVersion:
          type: integer
          format: int64
          minimum: 1
    AggregationFeedCreate:
      type: object
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          pattern: ^https://
          maxLength: 2048
        format:
          $ref: '#/components/schemas/AggregationFeedFormat'
        scheduleMinutes:
          type: integer
          minimum: 5
          maximum: 1440
          default: 15
        categoryMapping:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AggregationCategoryMapping'
    AggregationFeedPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        url:
          type: string
          pattern: ^https://
          maxLength: 2048
        format:
          $ref: '#/components/schemas/AggregationFeedFormat'
        isEnabled:
          type: boolean
        scheduleMinutes:
          type: integer
          minimum: 5
          maximum: 1440
        categoryMapping:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AggregationCategoryMapping'
    AggregationFeedTestRequest:
      type: object
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          pattern: ^https://
          maxLength: 2048
        format:
          $ref: '#/components/schemas/AggregationFeedFormat'
    AggregationFeedTestItem:
      type: object
      required:
      - title
      - url
      - timeReliable
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
        timeReliable:
          type: boolean
    AggregationFeedTestResult:
      type: object
      required:
      - ok
      - robotsAllowed
      - itemCount
      - sampleItems
      - durationMs
      properties:
        ok:
          type: boolean
        httpStatus:
          type:
          - integer
          - 'null'
        detectedFormat:
          anyOf:
          - $ref: '#/components/schemas/AggregationFeedFormat'
          - type: 'null'
        feedTitle:
          type:
          - string
          - 'null'
        robotsAllowed:
          type: boolean
        itemCount:
          type: integer
          minimum: 0
        sampleItems:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/AggregationFeedTestItem'
        failure:
          anyOf:
          - $ref: '#/components/schemas/AggregationFeedFailure'
          - type: 'null'
        durationMs:
          type: integer
          minimum: 0
    AggregationSourceApprovalRecord:
      type: object
      required:
      - usageMode
      - termsEvidenceRef
      - approvedBy
      - approvedAt
      properties:
        usageMode:
          $ref: '#/components/schemas/AggregationUsageMode'
        licenseId:
          type:
          - string
          - 'null'
          format: uuid
        termsEvidenceRef:
          type: string
        note:
          type:
          - string
          - 'null'
        approvedBy:
          type: string
          format: uuid
        approvedAt:
          type: string
          format: date-time
    AggregationSourceSummary:
      type: object
      required:
      - id
      - name
      - status
      - usageMode
      - trustWeight
      - language
      - siteKeys
      - feedCount
      - rowVersion
      properties:
        id:
          type: string
          format: uuid
          description: Id of the source in the content source catalogue (ADR-0007).
        name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/AggregationSourceStatus'
        usageMode:
          $ref: '#/components/schemas/AggregationUsageMode'
        licenseId:
          type:
          - string
          - 'null'
          format: uuid
        trustWeight:
          type: integer
          minimum: 1
          maximum: 5
        language:
          type: string
          pattern: ^[a-z]{2}$
        siteKeys:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z][a-z0-9-]{0,30}$
        feedCount:
          type: integer
          minimum: 0
        itemsLast24h:
          type: integer
          minimum: 0
        worstFeedHealth:
          anyOf:
          - $ref: '#/components/schemas/AggregationFeedHealth'
          - type: 'null'
        rowVersion:
          type: integer
          format: int64
          minimum: 1
    AggregationSource:
      allOf:
      - $ref: '#/components/schemas/AggregationSourceSummary'
      - type: object
        required:
        - feeds
        - approvals
        properties:
          termsEvidenceRef:
            type:
            - string
            - 'null'
          proposedBy:
            type: string
            format: uuid
          approvedBy:
            type:
            - string
            - 'null'
            format: uuid
          approvedAt:
            type:
            - string
            - 'null'
            format: date-time
          feeds:
            type: array
            items:
              $ref: '#/components/schemas/AggregationFeed'
          approvals:
            type: array
            description: Most recent first; append-only history.
            items:
              $ref: '#/components/schemas/AggregationSourceApprovalRecord'
    AggregationSourceList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AggregationSourceSummary'
        nextCursor:
          type:
          - string
          - 'null'
    AggregationSourceCreate:
      type: object
      additionalProperties: false
      required:
      - contentSourceId
      - language
      - siteKeys
      properties:
        contentSourceId:
          type: string
          format: uuid
        trustWeight:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        language:
          type: string
          pattern: ^[a-z]{2}$
        siteKeys:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z][a-z0-9-]{0,30}$
    AggregationSourcePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        trustWeight:
          type: integer
          minimum: 1
          maximum: 5
        language:
          type: string
          pattern: ^[a-z]{2}$
        siteKeys:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z][a-z0-9-]{0,30}$
    AggregationSourceApprovalRequest:
      type: object
      additionalProperties: false
      required:
      - usageMode
      - termsEvidenceRef
      properties:
        usageMode:
          $ref: '#/components/schemas/AggregationUsageMode'
        licenseId:
          type:
          - string
          - 'null'
          format: uuid
        termsEvidenceRef:
          type: string
          minLength: 1
          maxLength: 500
          description: Reference to the saved copy of the source terms/robots at approval time.
        note:
          type: string
          maxLength: 2000
      if:
        required:
        - usageMode
        properties:
          usageMode:
            enum:
            - M2
            - M3
      then:
        required:
        - licenseId
        properties:
          licenseId:
            type: string
            format: uuid
    AggregationCategoryRule:
      type: object
      required:
      - categoryId
      - siteKey
      - categoryName
      - includeKeywords
      - excludeKeywords
      - entityKeywords
      - rowVersion
      properties:
        categoryId:
          type: string
          format: uuid
        siteKey:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,30}$
        categoryName:
          type: string
          readOnly: true
        includeKeywords:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
        excludeKeywords:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
        entityKeywords:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: Product, brand or company names used for clustering.
        updatedBy:
          type:
          - string
          - 'null'
          format: uuid
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        rowVersion:
          type: integer
          format: int64
          minimum: 1
    AggregationCategoryRuleList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AggregationCategoryRule'
    AggregationCategoryRulePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        includeKeywords:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
        excludeKeywords:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
        entityKeywords:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
    AggregationItem:
      type: object
      required:
      - id
      - sourceId
      - sourceName
      - feedId
      - title
      - url
      - firstSeenAt
      - timeReliable
      - status
      - sensitive
      - version
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        sourceName:
          type: string
        feedId:
          type: string
          format: uuid
        title:
          type: string
        url:
          type: string
          format: uri
        summary:
          type:
          - string
          - 'null'
          maxLength: 4000
          description: Plain text from the feed, sanitised.
        author:
          type:
          - string
          - 'null'
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
        firstSeenAt:
          type: string
          format: date-time
        timeReliable:
          type: boolean
        language:
          type:
          - string
          - 'null'
        feedCategories:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - NEW
          - CLASSIFIED
          - CLUSTERED
          - DUPLICATE
          - OUT_OF_SCOPE
        categoryId:
          type:
          - string
          - 'null'
          format: uuid
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        needsReview:
          type: boolean
        sensitive:
          type: boolean
        version:
          type: integer
          minimum: 1
          description: Above 1 when the source updated the item.
        clusterId:
          type:
          - string
          - 'null'
          format: uuid
    AggregationItemList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AggregationItem'
        nextCursor:
          type:
          - string
          - 'null'
    AggregationClusterStatus:
      type: string
      enum:
      - OPEN
      - WATCHING
      - DISMISSED
      - COVERED
      - CLOSED
      description: Phase 2 (AI drafts) will add values; clients must tolerate unknown values.
    AggregationClusterSummary:
      type: object
      required:
      - id
      - siteKey
      - title
      - representativeItemId
      - score
      - status
      - sourceCount
      - independentSourceCount
      - itemCount
      - firstSeenAt
      - lastItemAt
      - labels
      - maxUsageMode
      - rowVersion
      properties:
        id:
          type: string
          format: uuid
        siteKey:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,30}$
        title:
          type: string
        representativeItemId:
          type: string
          format: uuid
        primaryCategoryId:
          type:
          - string
          - 'null'
          format: uuid
        categoryNeedsReview:
          type: boolean
        score:
          type: number
          minimum: 0
          maximum: 100
        status:
          $ref: '#/components/schemas/AggregationClusterStatus'
        sourceCount:
          type: integer
          minimum: 1
        independentSourceCount:
          type: integer
          minimum: 1
        itemCount:
          type: integer
          minimum: 1
        firstSeenAt:
          type: string
          format: date-time
        lastItemAt:
          type: string
          format: date-time
        labels:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - SINGLE_SOURCE
            - SENSITIVE
            - SOURCE_UPDATED
            - NEW_SINCE_COVERED
        maxUsageMode:
          $ref: '#/components/schemas/AggregationUsageMode'
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
        coveredArticleId:
          type:
          - string
          - 'null'
          format: uuid
        rowVersion:
          type: integer
          format: int64
          minimum: 1
    AggregationClusterAction:
      type: object
      required:
      - action
      - actorId
      - at
      properties:
        action:
          type: string
          enum:
          - DISMISS
          - WATCH
          - REOPEN
          - CLAIM
          - COVER
          - SPLIT
          - MERGE
        actorId:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        reason:
          type:
          - string
          - 'null'
        relatedClusterId:
          type:
          - string
          - 'null'
          format: uuid
        articleId:
          type:
          - string
          - 'null'
          format: uuid
    AggregationClusterDetail:
      allOf:
      - $ref: '#/components/schemas/AggregationClusterSummary'
      - type: object
        required:
        - items
        - actions
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/AggregationItem'
          actions:
            type: array
            description: Most recent first.
            items:
              $ref: '#/components/schemas/AggregationClusterAction'
    AggregationClusterList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AggregationClusterSummary'
        nextCursor:
          type:
          - string
          - 'null'
    AggregationCoverageRequest:
      type: object
      additionalProperties: false
      required:
      - articleId
      properties:
        articleId:
          type: string
          format: uuid
    AggregationSplitRequest:
      type: object
      additionalProperties: false
      required:
      - itemIds
      properties:
        itemIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        reason:
          type: string
          maxLength: 2000
    AggregationMergeRequest:
      type: object
      additionalProperties: false
      required:
      - targetClusterId
      properties:
        targetClusterId:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 2000
    AggregationSourceHealth:
      type: object
      required:
      - sourceId
      - name
      - status
      - itemsToday
      properties:
        sourceId:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/AggregationSourceStatus'
        worstFeedHealth:
          anyOf:
          - $ref: '#/components/schemas/AggregationFeedHealth'
          - type: 'null'
        itemsToday:
          type: integer
          minimum: 0
        lastSuccessAt:
          type:
          - string
          - 'null'
          format: date-time
    AggregationStats:
      type: object
      required:
      - siteKey
      - date
      - timeZone
      - itemsToday
      - clustersToday
      - openClustersToday
      - sourcesByStatus
      - sources
      properties:
        siteKey:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,30}$
        date:
          type: string
          format: date
        timeZone:
          type: string
          example: Asia/Ho_Chi_Minh
        itemsToday:
          type: integer
          minimum: 0
        clustersToday:
          type: integer
          minimum: 0
        openClustersToday:
          type: integer
          minimum: 0
        fetchSuccessRate24h:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        sourcesByStatus:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AggregationSourceHealth'
  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Unauthenticated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not allowed. code ∈ CSRF_INVALID, FEATURE_DISABLED, FORBIDDEN, ELIGIBILITY_REQUIRED, SOD_VIOLATION, RIGHTS_EXPIRED (see x-error-codes)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found or non-public
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Resource gone per takedown policy
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: ETag mismatch (code REVISION_CONFLICT)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UploadTooLarge:
      description: Upload quota exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Domain validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limited (code RATE_LIMITED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    ServiceUnavailable:
      description: Dependency outage
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match required (code PRECONDITION_REQUIRED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PermanentRedirect:
      description: Slug changed; follow Location to the canonical URL
      headers:
        Location:
          $ref: '#/components/headers/Location'
    Found:
      description: Browser redirect
      headers:
        Location:
          $ref: '#/components/headers/Location'
        Set-Cookie:
          $ref: '#/components/headers/SetCookie'
    NoContent:
      description: Done, no body
