  /discovery/most-read:
    get:
      tags:
      - Discovery
      summary: Most read articles of the site (proposal)
      description: 'Proposal only, not implemented (UX-PUB-01 đợt 3): the "Đọc nhiều" block. Ranking of articles of the site resolved from Host by
        counted reads inside the window, computed from aggregated FR-ANL-001 events — no per-user data, no personalisation. Only articles visible
        right now (same rules as getHome) are returned; SPONSORED articles are excluded from the ranking (proposal, PO/Legal decide). When there
        is not enough data (below the threshold PO sets) items is empty and the client hides the block. The data source (aggregate table fed
        by the events pipeline vs snapshots exported from an analytics store) and the definition of a counted read are pending TL/PO/Legal.
        Access: Public, no session. Feature gate `discovery.most_read` (production default OFF), enforced server-side.'
      operationId: getMostReadArticles
      security: []
      parameters:
      - name: window
        in: query
        required: false
        description: Counting window.
        schema:
