      description: ''
components:
  securitySchemes:
    cmsSession:
      type: apiKey
      in: cookie
      name: tt_cms_session
      description: Placeholder; OIDC/MFA/session binding to be approved, CSRF protection required for cookie
        writes
    memberSession:
      type: apiKey
      in: cookie
      name: tt_member_session
      description: Placeholder; required identity verification and eligibility are legal policy decisions
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
      description: Opaque cursor, verified/signed if applicable
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Example bounds; final limit TBD performance/PO
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 250
    VideoId:
      name: videoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArticleId:
      name: articleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Resource revision/row_version ETag; reject mismatches with 412
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
      description: Actor+method+route scoped; same key different payload returns 409
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlacementId:
      name: placementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TopicId:
      name: topicId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    XCsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 8
      description: Double-submit or equivalent CSRF protection for session cookie mutations; final scheme depends
        on auth ADR
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: 'Examples: FEATURE_DISABLED, ELIGIBILITY_REQUIRED, SPONSORSHIP_LABEL_REQUIRED, RIGHTS_EXPIRED,
            REVISION_CONFLICT, CSRF_INVALID, RATE_LIMITED.'
        detail:
          type: string
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    ArticleSummary:
      type: object
      required:
      - id
      - slug
      - title
      - publishedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        summary:
          type:
          - string
          - 'null'
        publishedAt:
          type: string
          format: date-time
        thumbnailUrl:
          type:
          - string
          - 'null'
          format: uri
        contentKind:
          type: string
          enum:
          - EDITORIAL
          - SPONSORED
        sponsorLabel:
          type:
          - string
          - 'null'
    Article:
      allOf:
      - $ref: '#/components/schemas/ArticleSummary'
      - type: object
        properties:
          revisionId:
            type: string
            format: uuid
          authorDisplayName:
            type: string
          categorySlug:
            type: string
          bodyBlocks:
            type: array
            items:
