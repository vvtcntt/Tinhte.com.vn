openapi: 3.1.0
info:
  title: Tinhte.com.vn Reference API Contract
  version: 0.2.0-draft
  description: Expanded contract baseline for review; P0* community and P0-ADS require public release-gates.
    Not implementation-tested. Supersedes v0.1 only after sign-off.
servers:
- url: https://api.example.invalid/api/v1
  description: Placeholder — replace at deployment; no production host assumed
tags:
- name: PublicNews
- name: PublicVideo
- name: Discovery
- name: CmsNews
- name: Media
- name: CommunityGated
- name: ModerationGated
- name: Account
- name: CmsVideo
- name: CmsTaxonomy
- name: CmsUsers
- name: CmsRights
- name: Analytics
- name: Advertising
- name: AiOptional
- name: MemberOptional
- name: PublicHome
- name: StaffAuth
paths:
  /articles:
    get:
      tags:
      - PublicNews
      summary: Public article feed
      operationId: listPublicArticles
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: category
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Published articles only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleList'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-requirements:
      - FR-DISC-004
      - FR-ID-001
      x-scope: P0
      description: ''
  /articles/{slug}:
    get:
      tags:
      - PublicNews
      summary: Public article (only published revision and valid rights)
      operationId: getPublicArticle
      parameters:
      - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Public article
          headers:
            ETag:
              schema:
                type: string
              description: Published revision/version tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
      x-requirements:
      - FR-DISC-007
      - FR-NEWS-001
      - FR-NEWS-002
      - FR-NEWS-008
      - FR-NEWS-010
      x-scope: P0
      description: ''
  /videos:
    get:
      tags:
      - PublicVideo
      summary: Public Shorts feed ordered by approved policy
      operationId: listPublicVideos
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Published & rights-cleared video metadata only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoList'
      x-requirements:
      - FR-DISC-004
      - FR-ID-001
      - FR-VID-001
      - FR-VID-012
      - FR-VID-014
      x-scope: P0
      description: ''
  /videos/{videoId}:
    get:
      tags:
      - PublicVideo
      summary: Public video watch metadata
      operationId: getPublicVideo
      parameters:
      - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Video object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
      x-requirements:
      - FR-VID-003
      - FR-VID-004
      x-scope: P0
      description: ''
  /videos/{videoId}/playback:
    get:
      tags:
      - PublicVideo
      summary: Server-side rights gate and short-lived playback manifest authorization
      operationId: getVideoPlayback
      parameters:
      - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Signed derived manifest information, not raw source object keys
          headers:
            Cache-Control:
              schema:
                type: string
              description: Private/no-store or short TTL per rights policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackGrant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-requirements:
      - FR-VID-002
      - FR-VID-011
      x-scope: P0
      description: ''
  /search:
    get:
      tags:
      - Discovery
      summary: Public search for published news/video
      operationId: searchPublicContent
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search result list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-requirements:
      - FR-DISC-001
      - FR-DISC-004
      x-scope: P0
      description: ''
  /admin/articles:
    post:
      tags:
      - CmsNews
      summary: Create article draft (CMS only)
      operationId: createArticleDraft
      security:
      - cmsSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArticleRequest'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-requirements:
      - FR-CMS-001
      x-scope: P0
      parameters:
      - $ref: '#/components/parameters/XCsrfToken'
      description: ''
    get:
      tags:
      - CmsNews
      summary: Paginated CMS article list
      operationId: getAdminArticles
      x-scope: P0
      x-requirements:
      - FR-CMS-006
      security:
      - cmsSession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: ''
  /admin/articles/{articleId}/submit:
    post:
      tags:
      - CmsNews
      summary: Submit draft revision for review
      operationId: submitArticleForReview
      security:
      - cmsSession: []
      parameters:
      - $ref: '#/components/parameters/ArticleId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '200':
          description: In review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-requirements:
      - FR-NEWS-004
      x-scope: P0
      description: ''
  /admin/articles/{articleId}/approve:
    post:
      tags:
      - CmsNews
      summary: Approve revision with separation-of-duties policy
      operationId: approveArticleRevision
      security:
      - cmsSession: []
      parameters:
      - $ref: '#/components/parameters/ArticleId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - revisionId
              properties:
                revisionId:
                  type: string
                  format: uuid
                note:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Revision approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-requirements:
      - FR-CMS-002
      - FR-NEWS-004
      x-scope: P0
      description: ''
  /admin/articles/{articleId}/publish:
    post:
      tags:
      - CmsNews
      summary: Publish approved article revision, rights validated in DB transaction
      operationId: publishArticle
      security:
      - cmsSession: []
      parameters:
      - $ref: '#/components/parameters/ArticleId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - revisionId
              properties:
                revisionId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-requirements:
      - FR-CMS-003
      x-scope: P0
      description: ''
  /admin/media/upload-intents:
    post:
      tags:
      - Media
      summary: Create private upload intent (staff only)
      operationId: createUploadIntent
      security:
      - cmsSession: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fileName
              - contentType
              - sizeBytes
              - checksumSha256
              properties:
                fileName:
                  type: string
                  maxLength: 255
                contentType:
                  type: string
                  maxLength: 150
                sizeBytes:
                  type: integer
                  format: int64
                  minimum: 1
                checksumSha256:
                  type: string
                  pattern: ^[a-fA-F0-9]{64}$
      responses:
        '201':
          description: Short-lived upload intent (authorization restricted to object key and size)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/UploadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-requirements:
      - FR-VID-005
      x-scope: P0
      description: ''
  /admin/media/{mediaId}/finalize:
    post:
      tags:
      - Media
      summary: Verify storage HEAD/metadata/checksum and queue media validation
      operationId: finalizeUpload
      security:
      - cmsSession: []
      parameters:
      - $ref: '#/components/parameters/MediaId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - uploadToken
              properties:
                uploadToken:
                  type: string
                  minLength: 1
      responses:
        '202':
          description: Accepted for asynchronous media processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaJobAccepted'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-requirements:
      - FR-VID-005
      x-scope: P0
      description: ''
  /admin/media/{mediaId}:
    get:
      tags:
      - Media
      summary: Poll media scan/transcode status from CMS
      operationId: getAdminMedia
      security:
      - cmsSession: []
      parameters:
      - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Media processing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - FR-CMS-009
      - FR-VID-006
      - FR-VID-007
      x-scope: P0
      description: ''
  /videos/{videoId}/comments:
    get:
      tags:
      - CommunityGated
      summary: Read visible comments only when video comment feature is legally enabled
      description: Legal gate OFF by default. Read policy is subject to Legal+PO decision. Server-side feature
        gates and eligibility are revalidated on each mutation; public activation requires separate approval.
      operationId: listVideoComments
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Visible approved comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentList'
        '403':
          $ref: '#/components/responses/CommentDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - FR-COM-001
      - FR-COM-005
      x-scope: P0*
      x-feature-gate: community.comments
    post:
      tags:
      - CommunityGated
      summary: Submit comment only if legal flag, video rights and member eligibility pass
      description: Must return 403 COMMENT_DISABLED while Legal+PO gate is OFF. Server-side feature gates and
        eligibility are revalidated on each mutation; public activation requires separate approval.
      operationId: createVideoComment
      security:
      - memberSession: []
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment accepted (may be pending moderation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CommentDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - FR-COM-002
      - FR-COM-008
      - FR-COM-009
      - FR-COM-012
      x-scope: P0*
      x-feature-gate: community.comments
  /comments/{commentId}/replies:
    post:
      tags:
      - CommunityGated
      summary: Reply to comment within same published video, feature legally enabled
      operationId: replyToComment
      security:
      - memberSession: []
      parameters:
      - $ref: '#/components/parameters/CommentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Reply accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '403':
          $ref: '#/components/responses/CommentDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - FR-COM-003
      x-scope: P0*
      x-feature-gate: community.comments
      description: ' Server-side feature gates and eligibility are revalidated on each mutation; public activation
        requires separate approval.'
  /admin/moderation/cases/{caseId}/actions:
    post:
      tags:
      - ModerationGated
      summary: Moderation decision with mandatory reason and audit
      operationId: addModerationAction
      security:
      - cmsSession: []
      parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              - reason
              properties:
                action:
                  type: string
                  enum:
                  - HIDE
                  - REMOVE
                  - RESTORE
                  - DISMISS
                  - ESCALATE
                reason:
                  type: string
                  minLength: 1
                  maxLength: 4000
      responses:
        '200':
          description: Moderation action saved and audited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationActionResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-requirements:
      - FR-COM-007
      - FR-MOD-002
      x-scope: P0*
      x-feature-gate: community.comments
      description: ' Server-side feature gates and eligibility are revalidated on each mutation; public activation
        requires separate approval.'
  /me:
    get:
      tags:
      - Account
      summary: Current authenticated user profile (non-sensitive subset)
      operationId: getCurrentUser
      security:
      - memberSession: []
      responses:
        '200':
          description: User profile
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      x-requirements:
      - FR-ID-002
      x-scope: P0
      description: ''
  /home:
    get:
      tags:
      - PublicHome
      summary: Public homepage editorial blocks
      operationId: getHome
      x-scope: P0
      x-requirements:
      - FR-DISC-003
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: ''
  /categories:
    get:
      tags:
      - Discovery
      summary: Public categories
      operationId: getCategories
      x-scope: P0
      x-requirements:
      - FR-NEWS-003
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: ''
  /topics:
    get:
      tags:
      - Discovery
      summary: Public topics
      operationId: getTopics
      x-scope: P0
      x-requirements:
      - FR-NEWS-003
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: ''
  /categories/{slug}/articles:
    get:
      tags:
      - Discovery
      summary: Published articles by category
      operationId: getCategoriesSlugArticles
      x-scope: P0
      x-requirements:
      - FR-DISC-002
      security: []
      parameters:
      - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: ''
  /topics/{slug}/articles:
    get:
      tags:
      - Discovery
      summary: Published articles by topic
      operationId: getTopicsSlugArticles
      x-scope: P0
      x-requirements:
      - FR-DISC-002
      security: []
      parameters:
      - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: ''
  /articles/{slug}/related-videos:
    get:
      tags:
      - Discovery
      summary: Published related videos
      operationId: getArticlesSlugRelatedVideos
      x-scope: P0
      x-requirements:
      - FR-DISC-005
      security: []
      parameters:
      - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
